name: Deploy to EC2 via SSM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM Run Command (force bash)
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ secrets.SSM_INSTANCE_ID }}"
          echo "Sending SSM command to $INSTANCE_ID..."

          # Send ONE remote command that runs entirely inside bash.
          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "GitHub Actions deploy (bash forced)" \
              --parameters 'commands=["bash -lc '\''set -euo pipefail
                echo DEPLOY_START: $(date -Is)

                # Update this path if your site/app lives elsewhere
                cd /var/www/html

                # If you use a different deploy mechanism, change these lines
                sudo git pull origin main
                sudo systemctl restart nginx

                echo DEPLOY_DONE: $(date -Is)
              '\''"]' \
              --query "Command.CommandId" \
              --output text
          )

          echo "CommandId: $COMMAND_ID"
          echo "Waiting for command to finish..."

          while true; do
            STATUS=$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )

            echo "Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "✅ Deploy succeeded"
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "❌ Deploy failed with status: $STATUS"
                echo "---- STDOUT ----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "S
