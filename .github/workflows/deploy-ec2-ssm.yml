name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM Run Command (force bash + debug)
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ secrets.SSM_INSTANCE_ID }}"
          echo "Sending SSM command to $INSTANCE_ID..."

          aws --version
          aws sts get-caller-identity

          # One remote command that runs entirely under bash
          REMOTE_CMD=$'bash -lc \'\nset -euo pipefail\n\necho "DEPLOY_START: $(date -Is)"\ncd /var/www/html\nsudo git pull origin main\nsudo systemctl restart nginx\necho "DEPLOY_DONE: $(date -Is)"\n\''

          echo "Calling send-command..."

          # Capture full error output if send-command fails
          set +e
          SEND_OUT=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy (bash forced)" \
            --parameters commands="$REMOTE_CMD" \
            --query "Command.CommandId" \
            --output text 2>&1)
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "❌ send-command failed:"
            echo "$SEND_OUT"
            exit 1
          fi

          COMMAND_ID="$SEND_OUT"
          echo "CommandId: $COMMAND_ID"
          echo "Waiting for command to finish..."

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "✅ Deploy succeeded"
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "❌ Deploy failed with status: $STATUS"
                echo "---- STDOUT ----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true
                echo "---- STDERR ----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                echo "Unknown status: $STATUS"
                sleep 5
                ;;
            esac
          done

          echo "---- FINAL STDOUT ----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true
