name: Deploy via S3 Artifact + SSM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package site artifact
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="site-${GITHUB_SHA}.zip"

          # Zip repo contents (exclude .git). Add more -x excludes if needed.
          zip -r "$ARTIFACT" . -x ".git/*"

          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Upload artifact to S3
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="${{ secrets.DEPLOY_BUCKET }}"
          KEY="deploy/${GITHUB_SHA}.zip"

          aws s3 cp "${{ env.ARTIFACT }}" "s3://${BUCKET}/${KEY}"

          echo "S3_KEY=$KEY" >> "$GITHUB_ENV"
          echo "Uploaded to s3://${BUCKET}/${KEY}"

      - name: Deploy on EC2 via SSM (download from S3, unzip, restart nginx)
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ secrets.SSM_INSTANCE_ID }}"
          BUCKET="${{ secrets.DEPLOY_BUCKET }}"
          KEY="${{ env.S3_KEY }}"

          aws --version
          aws sts get-caller-identity

          echo "Deploy target: ${INSTANCE_ID}"
          echo "Artifact: s3://${BUCKET}/${KEY}"

          # Build the remote deploy script without heredocs (avoids YAML/EOF indentation issues)
          REMOTE_SCRIPT="$(printf '%s\n' \
            'set -euo pipefail' \
            'echo "DEPLOY_START: $(date -Is)"' \
            'TMP_DIR="/tmp/deploy_$(date +%s)"' \
            'mkdir -p "$TMP_DIR"' \
            'cd "$TMP_DIR"' \
            "echo \"Downloading: s3://${BUCKET}/${KEY}\"" \
            "aws s3 cp \"s3://${BUCKET}/${KEY}\" artifact.zip" \
            'if ! command -v unzip >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y unzip; fi' \
            'rm -rf extracted && mkdir -p extracted' \
            'unzip -q artifact.zip -d extracted' \
            'sudo rm -rf /var/www/html/*' \
            'sudo cp -r extracted/* /var/www/html/' \
            'sudo systemctl restart nginx' \
            'echo "DEPLOY_DONE: $(date -Is)"' \
          )"

          B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_CMD="echo '$B64' | base64 -d | bash -s"

          PARAMS="$(jq -cn --arg cmd "$REMOTE_CMD" '{commands: [$cmd]}')"

          # Run SSM command and capture any send-command errors
          set +e
          SEND_OUT="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from S3 artifact (${GITHUB_SHA})" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text 2>&1)"
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "send-command failed:"
            echo "$SEND_OUT"
            exit 1
          fi

          COMMAND_ID="$SEND_OUT"
          echo "CommandId: $COMMAND_ID"
          echo "Waiting for command to finish..."

          while true; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)"

            echo "Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deploy succeeded"
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed with status: $STATUS"
                echo "STDOUT:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true
                echo "STDERR:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                sleep 5
                ;;
            esac
          done
