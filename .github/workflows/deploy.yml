name: Deploy site to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simple test (fail fast)
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          echo "site/index.html found ✅"

      - name: Prepare SSH key + connectivity check
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          # Use printf (more reliable than echo for multiline secrets)
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          HOST="$(printf "%s" "${{ secrets.EC2_HOST }}" | tr -d '\r\n')"
          USER="$(printf "%s" "${{ secrets.EC2_USER }}" | tr -d '\r\n')"

          # Best-effort known_hosts population (do not fail job if keyscan can't reach host)
          ssh-keyscan -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          echo "Checking SSH connectivity..."
          # Explicitly specify key with -i
          ssh -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            "$USER@$HOST" "echo SSH_OK"

      - name: Upload site to EC2 staging folder
        shell: bash
        run: |
          set -euo pipefail

          HOST="$(printf "%s" "${{ secrets.EC2_HOST }}" | tr -d '\r\n')"
          USER="$(printf "%s" "${{ secrets.EC2_USER }}" | tr -d '\r\n')"

          ssh -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            "$USER@$HOST" "mkdir -p /opt/cloudsupportlab/site"

          scp -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=no -o ConnectTimeout=10 -r \
            site/* "$USER@$HOST:/opt/cloudsupportlab/site/"

      - name: Deploy to web root + reload nginx (with backup)
        id: deploy_step
        shell: bash
        run: |
          set -euo pipefail

          HOST="$(printf "%s" "${{ secrets.EC2_HOST }}" | tr -d '\r\n')"
          USER="$(printf "%s" "${{ secrets.EC2_USER }}" | tr -d '\r\n')"

          ssh -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            "$USER@$HOST" '
              set -euo pipefail

              echo "==> Backing up current site"
              sudo -n mkdir -p /opt/cloudsupportlab/backup
              sudo -n rsync -a --delete /var/www/html/ /opt/cloudsupportlab/backup/ || true

              # Show what is in staging (proves BREAK_DEPLOY/file transfer)
              echo "==> Staging contents:"
              ls -la /opt/cloudsupportlab/site || true

              # BREAK_DEPLOY check (after backup, before deploy)
              if [ -f /opt/cloudsupportlab/site/BREAK_DEPLOY ]; then
                echo "❌ BREAK_DEPLOY present - failing intentionally"
                exit 1
              fi

              echo "==> Deploying new site"
              sudo -n rsync -a --delete /opt/cloudsupportlab/site/ /var/www/html/

              echo "==> Validating nginx config"
              sudo -n nginx -t

              echo "==> Reloading nginx"
              sudo -n systemctl reload nginx

              echo "✅ Deploy complete"
            '

      - name: Rollback (if deploy failed)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(printf "%s" "${{ secrets.EC2_HOST }}" | tr -d '\r\n')"
          USER="$(printf "%s" "${{ secrets.EC2_USER }}" | tr -d '\r\n')"

          echo "Deploy failed — attempting rollback..."
          ssh -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$USER@$HOST" '
            set -euo pipefail

            if [ ! -d /opt/cloudsupportlab/backup ] || [ -z "$(ls -A /opt/cloudsupportlab/backup 2>/dev/null)" ]; then
              echo "⚠️ No backup found at /opt/cloudsupportlab/backup — skipping rollback."
              exit 0
            fi

            sudo -n rsync -a --delete /opt/cloudsupportlab/backup/ /var/www/html/
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            echo "✅ Rollback complete"
          '

