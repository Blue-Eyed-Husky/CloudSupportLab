name: Deploy site to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simple test
        shell: bash
        run: |
          test -f site/index.html
          echo "site/index.html found ✅"

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          ssh -o StrictHostKeyChecking=no -o connecttimeout=10 \ 
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "echo 'SSH connection established'"

      - name: Upload site to EC2 staging folder
        shell: bash
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/cloudsupportlab/site"
          scp -r site/* "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/cloudsupportlab/site/"

      - name: Deploy to web root + reload nginx
        shell: bash
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            sudo rsync -a --delete ~/cloudsupportlab/site/ /var/www/html/ &&
            sudo nginx -t &&
            sudo systemctl reload nginx
          "
